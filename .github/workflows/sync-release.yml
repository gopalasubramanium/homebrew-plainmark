name: Sync published Plainmark release
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-release
  cancel-in-progress: false
jobs:
  sync:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the newest public upstream release
        run: |
          python3 -m unittest discover -s scripts
          python3 scripts/sync-release.py
      - name: Validate changed installation metadata before publishing
        run: |
          if git diff --quiet; then exit 0; fi
          mkdir -p "$(brew --repository)/Library/Taps/gopalasubramanium"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/gopalasubramanium/homebrew-plainmark"
          brew style gopalasubramanium/plainmark
          brew audit --cask gopalasubramanium/plainmark/plainmark@preview
          brew install --cask gopalasubramanium/plainmark/plainmark@preview
          codesign --verify --deep --strict /Applications/Plainmark.app
          xcrun stapler validate /Applications/Plainmark.app
          spctl --assess --type execute /Applications/Plainmark.app
          brew uninstall --cask gopalasubramanium/plainmark/plainmark@preview
      - name: Publish the verified cask update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/plainmark@preview.rb release-sync.json
          git commit -m 'Sync verified Plainmark release metadata'
          git push origin HEAD:main
